# CYT2BL3 probe-rs 芯片描述 v2
# Flash 算法: CAT1C_DFP 1.2.0 — CAT1C_4160.FLM
---
name: CYT2BL3
manufacturer:
  cc: 0x0
  id: 0x34
variants:
  - name: CYT2BL3BAAQ0AZSGS
    cores:
      - name: cm4
        type: armv7em
        core_access_options: !Arm
          ap: !v1 0
    memory_map:
      - !Nvm
        name: CodeFlash
        range:
          start: 0x10000000
          end: 0x10410000
        cores: [cm4]
        access:
          boot: true
      - !Nvm
        name: WorkFlash
        range:
          start: 0x14000000
          end: 0x14020000
        cores: [cm4]
      - !Ram
        name: SRAM
        range:
          start: 0x08000000
          end: 0x08080000
        cores: [cm4]
    flash_algorithms:
      - cyt2bl3_code_flash
flash_algorithms:
  - name: cyt2bl3_code_flash
    description: CYT2BL3 Code Flash 4160KB
    default: true
    instructions: 

    pc_init: 0x1
    pc_uninit: 0xa55
    pc_program_page: 0x891
    pc_erase_sector: 0x6b1
    pc_erase_all: 0x6a9
    data_section_offset: 0x1518
    flash_properties:
      address_range:
        start: 0x10000000
        end: 0x10410000
      page_size: 0x200
      erased_byte_value: 0x00
      program_page_timeout: 500
      erase_sector_timeout: 5000
      sectors:
        - size: 0x8000
          address: 0x0
